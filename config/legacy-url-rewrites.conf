# Source HTTP host/path prefix | replacement HTTP(S) base URL
#
# Rules run only for handset HTTP that reaches the compatibility gateway.  The
# first matching rule wins; keep a more-specific path before its host-wide
# fallback.  The unmatched source path suffix and query string are preserved.
#
# This default profile is the internal (service) portion of the Crosstalk
# WebOne rules.  It deliberately does not include its old browser-page/archive
# redirects; those can be added as explicit rules if wanted.

